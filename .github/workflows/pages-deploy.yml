name: Deploy to Cloudflare Pages

# 推送到 main 时，自动把最新版本部署到 Cloudflare Pages 项目 zouxunhao-portfolio。
# 网址保持不变：https://zouxunhao-portfolio.pages.dev/
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: 部署到 Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 自检 + 部署 + 部署后校验放在同一步。所有结论都写进 annotation，
      # 打开运行页顶部的 Annotations 就能看到，不用翻折叠日志。
      # 注意：本仓库公开，日志与 annotation 任何人可见，因此诊断只输出账户
      # 「名称」和判断结论，不打印账户 ID、令牌等原文。
      - name: 自检并部署
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 去掉粘贴 Secret 时常见带入的空格 / 换行 / 制表符。
          CF_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CF_ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')

          echo "① Secret 长度：令牌 ${#RAW_TOKEN} → ${#CF_TOKEN}，账户 ID ${#RAW_ACCOUNT} → ${#CF_ACCOUNT}"
          if [ "${#RAW_TOKEN}" != "${#CF_TOKEN}" ] || [ "${#RAW_ACCOUNT}" != "${#CF_ACCOUNT}" ]; then
            echo "::warning title=Secret 里有多余的空白或换行::已自动清理后继续部署。建议重新保存这两个 Secret，粘贴后确认末尾没有隐藏换行。"
          fi

          # 常见的填错方式一：把说明文字当成值填了进去
          bad=0
          if printf '%s' "$CF_TOKEN" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error title=Secret 填成了说明文字::CLOUDFLARE_API_TOKEN 的值里含有中文或非英文字符，说明填进去的是说明文字，不是真实令牌。真实令牌形如 cfut_ 开头的一长串字符。"
            bad=1
          fi
          if printf '%s' "$CF_ACCOUNT" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error title=Secret 填成了说明文字::CLOUDFLARE_ACCOUNT_ID 的值里含有中文或非英文字符，说明填进去的是说明文字，不是真实账户 ID。真实账户 ID 是 32 位十六进制字符（0-9 a-f）。"
            bad=1
          fi
          [ "$bad" = "0" ] || exit 1

          # 常见的填错方式二：账户 ID（32 位十六进制）填成了 zone ID（同样是 32 位十六进制）
          if [ -n "$CF_ACCOUNT" ] && printf '%s' "$CF_ACCOUNT" | LC_ALL=C grep -qvE '^[0-9a-f]{32}$'; then
            echo "::warning title=账户 ID 格式不常见::通常账户 ID 是 32 位小写十六进制（0-9 a-f）。当前长度 ${#CF_ACCOUNT}，请确认没填成别的东西。"
          fi

          ok=1
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=缺少 Secret::CLOUDFLARE_API_TOKEN 是空的。请到 Settings → Secrets and variables → Actions 添加，名称必须完全一致。"
            ok=0
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error title=缺少 Secret::CLOUDFLARE_ACCOUNT_ID 是空的。请到 Settings → Secrets and variables → Actions 添加，名称必须完全一致。"
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1

          echo "② 校验 API 令牌…"
          code=$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "   HTTP $code — $(head -c 200 /tmp/token.json)"
          if [ "$code" != "200" ]; then
            echo "::error title=API 令牌无效::校验返回 HTTP $code。请到 Cloudflare 后台重新生成令牌并更新 Secret。响应：$(head -c 300 /tmp/token.json)"
            exit 1
          fi
          echo "   令牌有效 ✅"

          echo "③ 校验账户 ID 与 Pages 项目权限…"
          code=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/zouxunhao-portfolio" \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$code" != "200" ]; then
            # 令牌本身有效，但访问不到该账户。用 /accounts 判断到底是账户 ID 填错还是令牌缺权限。
            acct_code=$(curl -sS -o /tmp/accounts.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer $CF_TOKEN")
            names=$(grep -o '"name":"[^"\\]*"' /tmp/accounts.json 2>/dev/null \
              | sed 's/"name":"//; s/"$//' | tr -d '\n' | paste -sd '、' -)

            if [ -z "$names" ]; then
              echo "::error title=令牌没绑定账户资源::令牌有效，但 /accounts 返回 HTTP $acct_code、看不到任何账户。请到 Cloudflare 后台重新创建令牌，创建时务必在「账户资源 / Account resources」一栏里选中你的账户，权限选「账户 / Account → Cloudflare Pages → 编辑 / Edit」。详情页面：https://dash.cloudflare.com/profile/api-tokens"
            elif grep -q "$CF_ACCOUNT" /tmp/accounts.json; then
              echo "::error title=令牌权限不足::账户 ID 没填错——它在令牌可访问的账户列表里。问题出在令牌权限：请确认该令牌的权限是「账户 / Account → Cloudflare Pages → 编辑 / Edit」，而不是 Workers 或其它服务。当前页面：https://dash.cloudflare.com/profile/api-tokens"
            else
              echo "::error title=账户 ID 填错了::你填的账户 ID 不在令牌可访问的账户列表里。令牌能访问的账户是：$names。最常见的原因是把 Zone ID 当成了 Account ID（两者都是 32 位十六进制，长得很像）。正确取法：打开 https://dash.cloudflare.com/?to=/:account/workers-and-pages ，地址栏里 dash.cloudflare.com/<这一段就是账户 ID>/workers-and-pages"
            fi
            echo "   （Pages 项目接口返回 HTTP $code）响应：$(head -c 200 /tmp/project.json)"
            exit 1
          fi
          echo "   账户 ID 与 Pages 项目均可访问 ✅"

          # Direct Upload 类型项目无法在 Cloudflare 后台修改「生产分支」，只能通过 API 设置。
          # 如果生产分支不是 main，下面的 --branch=main 会被当成「预览部署」，
          # 正式网址 https://zouxunhao-portfolio.pages.dev/ 就不会更新。
          echo "④ 确保生产分支为 main…"
          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/zouxunhao-portfolio" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main"}' > /dev/null

          echo "⑤ 开始部署…"
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"
          npx --yes wrangler@4 pages deploy . --project-name=zouxunhao-portfolio --branch=main

          # 部署后校验：确认这次真的是「生产环境」部署，正式网址确实被更新了。
          # 如果只是预览部署，网站会显示绿灯但简历上的网址其实没变，必须抓出来。
          echo "⑥ 校验本次是否为生产环境部署…"
          dcode=$(curl -sS -o /tmp/deploys.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/zouxunhao-portfolio/deployments?per_page=1" \
            -H "Authorization: Bearer $CF_TOKEN")
          # 兼容 JSON 里冒号后带空格的写法
          env_name=$(grep -o '"environment"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/deploys.json 2>/dev/null \
            | head -n 1 | sed 's/.*:[[:space:]]*"//; s/"$//')
          branch=$(grep -o '"branch"[[:space:]]*:[[:space:]]*"[^"]*"' /tmp/deploys.json 2>/dev/null \
            | head -n 1 | sed 's/.*:[[:space:]]*"//; s/"$//')
          echo "   部署记录接口 HTTP $dcode / environment=$env_name / branch=$branch"

          if [ "$env_name" = "production" ]; then
            echo "::notice title=已发布到正式网址::https://zouxunhao-portfolio.pages.dev/ 已更新（environment=production，分支 $branch）"
          elif [ -n "$env_name" ]; then
            echo "::error title=这次只部署到了预览环境::environment=$env_name，正式网址 https://zouxunhao-portfolio.pages.dev/ 没有被更新。请检查项目的「生产分支 / Production branch」是否为 main。"
            exit 1
          else
            # 部署本身已成功，只是这次校验没解析出来，避免用红叉掩盖部署结果
            echo "::warning title=无法解析部署记录（部署本身已成功）::部署记录接口返回 HTTP $dcode，未能解析出 environment 字段。响应片段：$(head -c 400 /tmp/deploys.json)"
          fi
